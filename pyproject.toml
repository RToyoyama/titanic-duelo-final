[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic"
version = "0.1.0"
description = "Titanic survival prediction — duelo final de modelos"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "imbalanced-learn>=0.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "kaggle>=1.8",
    "six>=1.16",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "pre-commit>=3.7", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "D", "ANN"]
ignore = ["D104"]
unfixable = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"*.ipynb" = ["D", "ANN", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
